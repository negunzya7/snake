<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(ellipse at top, #1d2a25 0%, #101713 52%, #090d0b 100%);
      color: #edf4ef;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stats {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-bottom: 2px;
    }
    .stat { min-width: 52px; text-align: center; }
    .label {
      display: block;
      margin-bottom: 2px;
      color: #a4b3aa;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .value { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .divider { width: 1px; height: 30px; background: #39463e; }
    .board {
      position: relative;
      width: min(600px, calc(100vw - 24px));
      aspect-ratio: 3 / 2;
      border: 1px solid #405347;
      border-radius: 10px;
      background-color: #111a14;
      background-image: url("snake.webp");
      background-size: cover;
      background-position: center;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
      overflow: hidden;
    }
    .player, .star {
      position: absolute;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      transform: translateZ(0);
    }
    .restart {
      padding: 7px 13px;
      border: 1px solid #405347;
      border-radius: 7px;
      background: rgba(255,255,255,.03);
      color: #d2ded5;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .restart:hover { background: rgba(255,255,255,.09); }
  </style>
</head>
<body>
  <div class="stats">
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="divider"></div>
    <div class="stat"><span class="label">Time</span><span class="value" id="timer">30</span></div>
  </div>

  <div class="board" id="board">
    <div id="player" class="player">👻</div>
    <div id="star" class="star">😧</div>
  </div>
  <button class="restart" id="restart">Restart</button>

  <script>
    const board = document.getElementById('board');
    const player = document.getElementById('player');
    const star = document.getElementById('star');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const CELL = 10;
    let x, y, starX, starY, direction, score, timeLeft, boost;
    let moveTimer = null, countdownTimer = null, ended = false;

    function dimensions() {
      return { width: board.clientWidth, height: board.clientHeight };
    }
    function placeStar() {
      const { width, height } = dimensions();
      const cols = Math.max(1, Math.floor((width - 20) / CELL));
      const rows = Math.max(1, Math.floor((height - 20) / CELL));
      do {
        starX = Math.floor(Math.random() * cols) * CELL;
        starY = Math.floor(Math.random() * rows) * CELL;
      } while (starX === x && starY === y);
    }
    function draw() {
      player.style.left = `${x}px`;
      player.style.top = `${y}px`;
      star.style.left = `${starX}px`;
      star.style.top = `${starY}px`;
    }
    function move() {
      if (ended) return;
      const { width, height } = dimensions();
      if (direction === 'right') x += CELL;
      if (direction === 'left') x -= CELL;
      if (direction === 'up') y -= CELL;
      if (direction === 'down') y += CELL;
      if (x < 0) x = Math.floor((width - 20) / CELL) * CELL;
      if (x > width - 20) x = 0;
      if (y < 0) y = Math.floor((height - 20) / CELL) * CELL;
      if (y > height - 20) y = 0;
      if (x === starX && y === starY) {
        score++;
        scoreEl.textContent = score;
        placeStar();
      }
      draw();
    }
    function setSpeed() {
      clearInterval(moveTimer);
      moveTimer = setInterval(move, boost ? 180 : 350);
    }
    function endGame() {
      ended = true;
      clearInterval(moveTimer);
      clearInterval(countdownTimer);
      moveTimer = countdownTimer = null;
      setTimeout(() => alert(`Your score is ${score}`), 20);
    }
    function restart() {
      clearInterval(moveTimer);
      clearInterval(countdownTimer);
      const { width, height } = dimensions();
      x = Math.min(20, Math.floor((width - 20) / CELL) * CELL);
      y = 20;
      direction = 'right';
      score = 0;
      timeLeft = 30;
      boost = false;
      ended = false;
      scoreEl.textContent = '0';
      timerEl.textContent = '30';
      placeStar();
      draw();
      setSpeed();
      countdownTimer = setInterval(() => {
        if (ended) return;
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }
    document.addEventListener('keydown', event => {
      const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (keys[event.code]) {
        event.preventDefault();
        if (!ended) direction = keys[event.code];
      }
      if (event.code === 'Space') {
        event.preventDefault();
        if (!boost && !ended) { boost = true; setSpeed(); }
      }
    });
    document.addEventListener('keyup', event => {
      if (event.code === 'Space' && boost) { boost = false; if (!ended) setSpeed(); }
    });
    document.getElementById('restart').addEventListener('click', restart);
    window.addEventListener('resize', draw);
    restart();
  </script>
</body>
</html>
