<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<style>
    .board {
        width: 200px;
        height: 150px;
        border: 1px solid gray;
        background-color: aquamarine;
        margin: 0 auto;
        position: relative;
    }

    .player,
    .star {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        font-size: 8px;
        text-align: center;
        position: absolute;
    }

    .cont {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
    }
</style>

<body>
    <div class="cont">
        <div id="score" class="box" style="width: 50px; height: 30px; display: flex; align-items: center; margin: 0;">0
        </div>
        <div id="timer" class="box" style="width: 50px; height: 30px; display: flex; align-items: center;">30</div>
    </div>
    <div class="board" id="board">
        <div id="player" class="player">👻</div>
        <div id="star" class="star">😧</div>
    </div>
    <!-- <div style="display: flex;">
        <button class="button is-black" onclick="changeDir('left')">⬅️</button>
        <div style="display: flex; flex-direction: column;">
            <button class="button is-black" onclick="changeDir('up')">⬆️</button>
            <button class="button is-black" onclick="changeDir('down')">⬇️</button>
        </div>
        <button class="button is-black" onclick="changeDir('right')">➡️</button>
    </div> -->
    <script>
        let direction = "right"
        let score = 0
        let playerX = 10
        let playerY = 20
        let starX = 40
        let starY = 50
        let timer = 30
        const timerEl = document.getElementById("timer")
        setInterval(function () {
            timer--;
            timerEl.textContent = timer;
            if (timer == 0) {
                alert(`Your score is ${score}`);
                timer = 30;
                location.reload();
            }
        }, 1000);
        const boardHeight = 150;
        const boardWidth = 200;
        const boardEl = document.getElementById("board")
        const playerEl = document.getElementById("player")
        const starEl = document.getElementById("star")
        boardEl.style.width = `${boardWidth}px`
        boardEl.style.height = `${boardHeight}px`
        draw();
        function moveUp() {
            playerY = playerY - 10;
            if (playerY < 0) {
                playerY = boardHeight - 10;
            }
            draw()
        }
        function moveDown() {
            playerY = playerY + 10;
            if (playerY > boardHeight - 10) {
                playerY = 0;
            }
            draw()
        }
        function moveLeft() {
            playerX = playerX - 10;
            if (playerX < 0) {
                playerX = boardWidth - 10;
            }
            draw()
        }
        function moveRight() {
            playerX = playerX + 10;
            if (playerX > boardWidth - 10) {
                playerX = 0;
            }
            draw()
        }
        function draw() {
            playerEl.style.top = `${playerY}px`;
            playerEl.style.left = `${playerX}px`;
            starEl.style.left = `${starX}px`;
            starEl.style.top = `${starY}px`;
            if (playerX == starX && playerY == starY) {
                score++;
                document.getElementById("score").textContent = score;
                starX = getRandomInt(20) * 10
                starY = getRandomInt(10) * 10
                draw();
            }
        }
        document.addEventListener("keydown", function (event) {
            if (event.code == "ArrowUp") {
                changeDir('up')
            } else if (event.code == "ArrowDown") {
                changeDir('down')
            } else if (event.code == "ArrowRight") {
                changeDir('right')
            } else if (event.code == "ArrowLeft") {
                changeDir('left')
            }
        });
        document.addEventListener("keyup", function (event) {
            if (event.code == "Space") {
                spacePressed = false;
                speed = 200;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, speed);
            }
        });
        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }
        function gameLoop() {
            if (direction == "right") {
                moveRight();
            } else if (direction == "left") {
                moveLeft();
            } else if (direction == "up") {
                moveUp();
            } else if (direction == "down") {
                moveDown();
            }
        }
        function changeDir(newDir) {
            direction = newDir
        }
        let speed = 350
        setInterval(gameLoop, speed);
    </script>
</body>

</html>
